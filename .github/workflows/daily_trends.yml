name: Daily UGC & Trend Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Roblox Catalog & Trend Scraper
        run: python scripts/scrape_trends.py

      - name: Commit updated trend snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json data/fallback.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily Roblox UGC trend snapshot"
            git push
          else
            echo "No trend data changes to commit."
          fi
